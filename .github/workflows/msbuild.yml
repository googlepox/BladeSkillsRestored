name: Build OBSE Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout xOBSE SDK
        uses: actions/checkout@v4
        with:
          repository: llde/xOBSE
          ref: master

      - name: Checkout EditorIDMapper
        uses: actions/checkout@v4
        with:
          repository: googlepox/EditorIDMapper
          ref: master
          path: EditorIDMapper

      - name: Checkout OBSEKeywords
        uses: actions/checkout@v4
        with:
          repository: googlepox/OBSEKeywords
          ref: master
          path: OBSEKeywords
          
      - name: Checkout True Custom Skills
        uses: actions/checkout@v4
        with:
          repository: googlepox/TrueCustomSkills
          ref: master
          path: TrueCustomSkills

      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: BladeSkillsRestored

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild BladeSkillsRestored/BladeSkillsRestored.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BladeSkillsRestored
          path: |
            BladeSkillsRestored/Release/BladeSkillsRestored.dll
            BladeSkillsRestored/Release/BladeSkillsRestored.pdb
